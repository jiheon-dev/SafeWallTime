[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SafeWallTime"
version = "0.1.0"
description = "SafeWallTime: uncertainty-aware runtime prediction for HPC scheduling"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Jiheon Choi"},
]
keywords = ["hpc", "scheduling", "runtime-prediction", "uncertainty-quantification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
lightgbm = ["lightgbm>=4.0"]
all = ["lightgbm>=4.0"]
dev = ["pytest>=7"]
release = ["build>=1", "twine>=5"]

[tool.setuptools.packages.find]
include = ["safewalltime*"]
